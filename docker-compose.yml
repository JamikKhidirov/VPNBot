version: "3.8"

services:
  bot:
    build: .
    container_name: vpnbot
    restart: unless-stopped
    env_file: .env
    ports:
      - "9090:9090"   # subscription server
      - "8080:8080"   # webhook (если используется)
    volumes:
      - ./.env:/app/.env
      - ./vpnbot.db:/app/vpnbot.db
    networks:
      - vpnbot-network

  # ── Опционально: PostgreSQL ────────────────────────────────
  # Запуск: docker compose --profile postgres up -d
  # В .env: DB_URL=postgresql+asyncpg://vpnbot:vpnbot@postgres:5432/vpnbot
  postgres:
    image: postgres:16-alpine
    container_name: vpnbot-db
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: vpnbot
      POSTGRES_PASSWORD: vpnbot
      POSTGRES_DB: vpnbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpnbot-network

  # ── Опционально: Redis ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vpnbot-redis
    restart: unless-stopped
    profiles: ["redis"]
    networks:
      - vpnbot-network

volumes:
  pgdata:

networks:
  vpnbot-network:
    driver: bridge
