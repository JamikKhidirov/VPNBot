<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="180" viewBox="0 0 1280 180" role="img" aria-label="VPNBot footer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="50%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#071a2b"/>
    </linearGradient>

    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.9"/>
      <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.35"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="180" fill="url(#bg)"/>
  <ellipse cx="640" cy="180" rx="520" ry="90" fill="url(#glow)"/>

  <!-- animated waves -->
  <path d="M0 120 C 160 84, 300 156, 460 120 C 620 84, 760 156, 920 120 C 1080 84, 1180 140, 1280 116 L1280 180 L0 180 Z"
        fill="url(#wave2)">
    <animate attributeName="d"
      values="M0 120 C 160 84, 300 156, 460 120 C 620 84, 760 156, 920 120 C 1080 84, 1180 140, 1280 116 L1280 180 L0 180 Z;
              M0 112 C 160 148, 300 88, 460 124 C 620 160, 760 92, 920 128 C 1080 164, 1180 100, 1280 124 L1280 180 L0 180 Z;
              M0 120 C 160 84, 300 156, 460 120 C 620 84, 760 156, 920 120 C 1080 84, 1180 140, 1280 116 L1280 180 L0 180 Z"
      dur="9s" repeatCount="indefinite"/>
  </path>

  <path d="M0 138 C 180 112, 340 164, 520 140 C 700 116, 860 168, 1040 142 C 1160 126, 1220 150, 1280 138"
        fill="none" stroke="url(#wave1)" stroke-width="2.4" opacity="0.85">
    <animate attributeName="d"
      values="M0 138 C 180 112, 340 164, 520 140 C 700 116, 860 168, 1040 142 C 1160 126, 1220 150, 1280 138;
              M0 146 C 180 172, 340 120, 520 144 C 700 168, 860 118, 1040 146 C 1160 158, 1220 128, 1280 146;
              M0 138 C 180 112, 340 164, 520 140 C 700 116, 860 168, 1040 142 C 1160 126, 1220 150, 1280 138"
      dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- floating dots -->
  <g fill="#67e8f9">
    <circle cx="180" cy="60" r="2.4" opacity="0.7">
      <animate attributeName="cy" values="60;48;60" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="90" r="1.8" opacity="0.5">
      <animate attributeName="cy" values="90;80;90" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="54" r="2.2" opacity="0.6">
      <animate attributeName="cy" values="54;44;54" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="86" r="1.8" opacity="0.45">
      <animate attributeName="cy" values="86;76;86" dur="5.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- center text -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="64" font-size="22" font-weight="800" fill="#e2e8f0">VPNBot</text>
    <text x="640" y="88" font-size="12" fill="#64748b">Telegram VPN Store · VLESS Reality · 3x-ui</text>
    <text x="640" y="112" font-size="11" fill="#475569">Один файл с серверами. Одна команда. Готовый бизнес.</text>
  </g>

  <!-- small pills -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" font-weight="600">
    <rect x="486" y="126" width="96" height="24" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="534" y="142" text-anchor="middle" fill="#67e8f9">Fast Deploy</text>

    <rect x="592" y="126" width="96" height="24" rx="12" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.4"/>
    <text x="640" y="142" text-anchor="middle" fill="#a5b4fc">Secure</text>

    <rect x="698" y="126" width="96" height="24" rx="12" fill="#0f172a" stroke="#f472b6" stroke-opacity="0.4"/>
    <text x="746" y="142" text-anchor="middle" fill="#f9a8d4">Ready to Sell</text>
  </g>
</svg>
